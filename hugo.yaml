baseURL: "https://andreabrduque.github.io/andrea-tech-notes/"
title: "Andréa's Notes"
theme: PaperMod
languageCode: en-us
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pagination:
  pagerSize: 10

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home:
    - HTML
    - RSS
    - JSON # required for search

params:
  env: production
  title: "Andréa's Notes"
  description: "Thoughts on applied AI, ML, agents and the cloud."
  author: "Andréa Duque"
  keywords: [AI, ML, agents, cloud, Azure]
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  ShowToc: true
  TocOpen: false
  ShowFullTextinRSS: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  comments: false
  math: true

  homeInfoParams:
    Title: "👋 Welcome"
    Content: >
      Hi, I'm Andréa. I write about applied AI, ML, agents and the cloud.


      *Opinions here are my own and do not represent those of my employer.*

  footer:
    text: "Opinions are my own and not those of my employer"

  socialIcons:
    - name: github
      url: "https://github.com/andreabrduque"
    - name: rss
      url: "index.xml"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

  assets:
    disableHLJS: true

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: archive
      name: Archive
      url: /archives/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 40

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: monokai
  tableOfContents:
    startLevel: 2
    endLevel: 3
